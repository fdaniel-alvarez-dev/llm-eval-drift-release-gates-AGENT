[project]
name = "llm-eval-drift-release-gates"
version = "0.1.0"
description = "Offline LLM evaluation toolkit with drift detection and release gates."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Daniel" }]
dependencies = [
  "pydantic>=2.6,<3",
  "rich>=13.7,<14",
  "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval", "monitoring"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
