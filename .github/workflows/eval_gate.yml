name: eval-gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run evaluation
        run: |
          python -m eval.runner --out eval_report.json

      - name: Enforce release gate (<=3% regression)
        run: |
          test -f baseline_eval_report.json
          python -m monitoring.release_gate --baseline baseline_eval_report.json --daily eval_report.json --max-regression 0.03

